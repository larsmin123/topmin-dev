<!doctype html>

<title>TOP/MIN, platen</title>
<meta name="description" content="79 platen om in te zoomen, verbonden door wat erop te zien is: vorm, materiaal, techniek, motief en verhouding.">

</head>
<body class="sheet">

<a class="logo" href="index.html" aria-label="TOP/MIN, naar de site">
  <svg viewBox="0 0 605 100" aria-hidden="true">
    <path d="M0 0h80v12H46v88H34V12H0z"/>
    <path fill-rule="evenodd" d="M146 0a50 50 0 1 0 0 100a50 50 0 1 0 0-100zm0 12a38 38 0 1 1 0 76a38 38 0 1 1 0-76z"/>

</a>

<a class="top-link menu-button micro" href="index.html">Naar de site</a>

<main>
  <section class="pl-section">
    <span class="label micro">Platen</span>
    <h1 class="pl-title">79 platen, vijf manieren van kijken.</h1>
    <p class="lead">Wat hier verbonden is, is op de foto te zien of nagemeten. De platen staan van rond naar lang. Kies er een om in te zoomen.</p>

    <div class="axes" role="group" aria-label="Verbind de platen op">
      <button type="button" class="axis micro" data-axis="vorm" aria-pressed="true">Vorm</button>
      <button type="button" class="axis micro" data-axis="materiaal" aria-pressed="false">Materiaal</button>
      <button type="button" class="axis micro" data-axis="techniek" aria-pressed="false">Techniek</button>
      <button type="button" class="axis micro" data-axis="motief" aria-pressed="false">Motief</button>
      <button type="button" class="axis micro" data-axis="verhouding" aria-pressed="false">Verhouding</button>
    </div>
    <div class="links-caption micro" role="group" aria-label="Waarden op deze as"></div>

    <div class="pl-wrap">
      <div class="pl-grid"></div>
      <svg class="pl-lines" aria-hidden="true"></svg>
    </div>
    <p class="plates-caption micro">Fotografie, Pim Top</p>
  </section>
</main>

<div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <div class="viewer-stage">
    <div class="viewer-plate">
      <img alt="">
      <svg class="viewer-measure" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="viewer-panel">
    <span class="viewer-number micro"></span>
    <h2 id="viewer-title"></h2>
    <dl class="viewer-meta"></dl>
    <div class="viewer-tools">
      <button type="button" class="tool micro" data-tool="out" aria-label="Zoom uit">−</button>
      <button type="button" class="tool micro" data-tool="in" aria-label="Zoom in">+</button>
      <button type="button" class="tool micro" data-tool="measure" aria-pressed="false">Maat</button>
      <button type="button" class="tool micro" data-tool="close">Sluit</button>
    </div>
  </div>
</div>

<script src="platen-data.js"></script>
<script src="platen.js"></script>
</body>
</html>
